[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

# Function timeout is deliberately NOT set here. Netlify has no `timeout`
# property under [functions] — every key there names a function to scope
# settings to, so `timeout = 26` was read as a function called "timeout" and
# failed the whole build at the config-parsing stage, before anything ran.
#
# The limit still matters: synchronous functions stop at 10s, while forking a
# 1191-key branch measured ~12.9s and a large import is comparable. Raising it
# to the 26s maximum is a per-site setting on a paid plan, done in the Netlify
# UI or by support — not in this file. The `maxDuration` exports on the import
# and fork routes document the requirement and are what Vercel would read; this
# runtime bundles every route into one function and ignores them.

[[plugins]]
  package = "@netlify/plugin-nextjs"
